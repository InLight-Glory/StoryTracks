[package]
name = "storytracks-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
base64 = "0.22"
sha2 = "0.10"
chrono = "0.4"
uuid = "1"
regex = "1"
tempfile = "3"
percent-encoding = "2"

[dev-dependencies]
tempfile = "3"
