[package]
name = "storytracks"
version = "0.1.0"
edition = "2021"
default-run = "StoryTracks"

[[bin]]
name = "StoryTracks"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
storytracks-core = { path = "../../crates/storytracks-core" }
serde_json = "1"
rfd = "0.15"
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]
